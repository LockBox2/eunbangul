<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>은방울 관리일지 · 마을 보기 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2a2118; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 80% at 50% 30%, #3a4682, #161b3d 70%); color: #fff6dc; font-family: "Gowun Dodum", sans-serif; overflow: hidden; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; }
  h1 { margin: 0; font: 700 1.25rem "Gowun Batang", serif; letter-spacing: .02em; text-align: center; }
  .sub { margin: -10px 0 0; font-size: .85rem; opacity: .75; text-align: center; }
  .stage { position: relative; width: min(88vw, 400px); aspect-ratio: 1; perspective: none; }
  .board { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 1.6s cubic-bezier(.45,.05,.25,1); border-radius: 10px; }
  .stage.iso .board { transform: translateY(4%) rotateX(56deg) rotateZ(-45deg) scale(.84); }
  .tile { position: absolute; transform-style: preserve-3d; border: 1px solid rgba(40,30,20,.10); border-radius: 3px; transition: border-radius 1.6s; }
  .stage.iso .tile { border-radius: 0; } /* filter·overflow를 쓰면 3D가 납작해진다 */
  .tile.edge-t { border-top: 2px solid rgba(60,45,30,.45); } .tile.edge-l { border-left: 2px solid rgba(60,45,30,.45); }
  .tile.edge-b { border-bottom: 2px solid rgba(60,45,30,.45); } .tile.edge-r { border-right: 2px solid rgba(60,45,30,.45); }
  /* 저택: 칸 위로 솟는 상자. 벽은 바닥 모서리를 축으로 세운다 */
  .house { position: absolute; left: 42%; top: 2%; width: 54%; height: 54%; transform-style: preserve-3d; }
  .house .face { position: absolute; }
  .house .roof { inset: -6%; transform: translateZ(0); transition: transform 1.1s cubic-bezier(.3,1.4,.5,1); border-radius: 2px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.15), inset 0 -6px 0 rgba(0,0,0,.12); }
  .house .wall { background: linear-gradient(#fbf3e2, #e9dbbf); }
  .house .s, .house .n { left: 0; width: 100%; height: 0; transform-origin: 50% 0; transition: height 1.1s cubic-bezier(.3,1.4,.5,1); }
  .house .s { top: 100%; transform: rotateX(90deg); }
  .house .n { top: 0; transform: rotateX(90deg); }
  .house .e, .house .w { top: 0; height: 100%; width: 0; transform-origin: 0 50%; transition: width 1.1s cubic-bezier(.3,1.4,.5,1); }
  .house .e { left: 100%; transform: rotateY(-90deg); }
  .house .w { left: 0; transform: rotateY(-90deg); }
  .house .s::after { content: ""; position: absolute; left: 36%; top: 0; width: 28%; height: 55%; background: #7a5534; border-radius: 0 0 3px 3px; }
  .house .e::after { content: ""; position: absolute; left: 35%; top: 22%; width: 30%; height: 20%; background: #a9cbe8; box-shadow: 0 300% 0 #a9cbe8; }
  .stage.iso .house .roof { transform: translateZ(var(--h)); }
  .stage.iso .house .s, .stage.iso .house .n { height: var(--h); }
  .stage.iso .house .e, .stage.iso .house .w { width: var(--h); }
  /* 서 있는 것들(관리원·수레·나무): 판이 기울면 일어선다 */
  .stand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; transition: transform 1.3s cubic-bezier(.3,1.3,.5,1); }
  .staff { width: 92%; height: 92%; left: 4%; top: 4%; bottom: auto; background: center / contain no-repeat; transform-origin: 50% 100%; }
  .stage.iso .staff { left: -14%; top: auto; bottom: -6%; width: 66%; height: 104%; transform: rotateZ(45deg) rotateX(-56deg) translateZ(1px); }
  .cart { width: 90%; height: 90%; left: 5%; top: 5%; bottom: auto; background: url(img/cart.webp) center / contain no-repeat; }
  .stage.iso .cart { top: auto; bottom: 20%; height: 95%; transform: rotateZ(45deg) rotateX(-56deg) translateZ(1px); }
  .need { position: absolute; right: 4%; top: 2%; width: 34%; aspect-ratio: 1; border-radius: 50%; background: #fff; color: #2a3266; font: 700 .8rem sans-serif; display: grid; place-items: center; box-shadow: 0 0 0 2px #2a3266; }
  .tree { left: 26%; bottom: 34%; width: 48%; height: 0; transform: rotateZ(45deg) rotateX(-56deg); opacity: 0; transition: height .9s cubic-bezier(.3,1.5,.5,1), opacity .4s; }
  .tree::before { content: ""; position: absolute; left: 0; right: 0; bottom: 18%; top: 0; background: linear-gradient(#7fb06a, #4f8a4a); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .tree::after { content: ""; position: absolute; left: 42%; width: 16%; bottom: 0; height: 22%; background: #7a5534; }
  .stage.iso .tree { height: 72%; opacity: 1; }
  .shadow { position: absolute; inset: 8% 8% -6% 8%; border-radius: 50%; background: radial-gradient(rgba(0,0,0,.35), rgba(0,0,0,0) 65%); opacity: 0; transition: opacity 1.4s; transform: translateZ(-2px); }
  .stage.iso .shadow { opacity: 1; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; color: #fff6dc; background: linear-gradient(#2e3a72, #222b58); border: 1px solid #5a69a6; border-radius: 10px; padding: 10px 14px; min-height: 44px; box-shadow: 0 3px 0 #0b0f2a; }
  button.on { background: linear-gradient(#ee7a55, #d9603f 55%, #c24a2e); border-color: #f3a184; }
  .note { max-width: 400px; font-size: .82rem; line-height: 1.55; opacity: .8; text-align: center; margin: 0; }
  @media (prefers-reduced-motion: reduce) { .board, .tile, .house *, .stand, .tree, .shadow { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">로웰 고객 출장 · 72번 순회표</h1>
  <p class="sub" id="sub">판을 다 풀면 순회표가 마을이 됩니다</p>
  <div class="stage" id="stage"><div class="board" id="board"></div></div>
  <div class="btns">
    <button type="button" id="toggle">마을로 보기</button>
    <button type="button" data-b="0" class="on">72판 (7×7)</button>
    <button type="button" data-b="1">236판 (9×9 · 큰 댁)</button>
  </div>
  <p class="note">시안입니다. 칸 색이 그 댁의 정원, 관리원이 선 칸에 그 댁 저택이 섭니다. 큰 댁은 저택이 둘입니다.</p>
</div>
<script>
var COLORS = ['#f9e79d', '#c0e5bb', '#a6ddfb', '#dfc9fa', '#ffc5bc', '#ffd1a7', '#a3e9e2', '#c0d3ff', '#fbc4db'];
var ROOF = ['#c9a64a', '#6f9c63', '#5b93c2', '#8f73c0', '#c9675b', '#c98a4f', '#4fa59a', '#6b7fc4', '#c4648f'];
var BOARDS = [
  { title: '로웰 고객 출장 · 72번 순회표', n: 7, reg: 'BBBDDACBBDDCACBBBDCACEBDDCCCEDDFFGCEEEFFGCEEFFFGG', sol: '5142036', carts: '641', big: '' },
  { title: '분기 보고회 · 236번 순회표', n: 9, reg: 'CCCAAABBBDDCCDAEEBDDCCDDEEBDDCCDDDEBDDDDDFFEEDDDDDFFEEDDDHFFGGGDDDHFHGGGDHHHHHGGG', sol: '382475061', carts: '452', big: 'D' }
];
// 맞닿은 댁끼리 다른 색이 가도록 간단히 고른다 (게임에서는 색 거리로 더 꼼꼼히 고른다)
function looks(B) {
  var n = B.n, m = 0, adj = {}, i, c;
  for (i = 0; i < n * n; i++) m = Math.max(m, B.reg.charCodeAt(i) - 64);
  for (i = 0; i < n * n; i++) { var r = Math.floor(i / n); c = i % n; var a = B.reg.charCodeAt(i) - 65;
    [[0, 1], [1, 0]].forEach(function (d) { var r2 = r + d[0], c2 = c + d[1]; if (r2 >= n || c2 >= n) return; var b = B.reg.charCodeAt(r2 * n + c2) - 65; if (a !== b) { (adj[a] = adj[a] || {})[b] = 1; (adj[b] = adj[b] || {})[a] = 1; } }); }
  var pick = [], order = [0, 2, 4, 1, 3, 5, 6, 7, 8];
  for (var g = 0; g < m; g++) { for (var k = 0; k < order.length; k++) { var o = order[(k + g * 2) % 9], ok = true; for (var h in (adj[g] || {})) if (pick[h] === o) ok = false; if (ok && pick.indexOf(o) < 0) { pick[g] = o; break; } } if (pick[g] == null) pick[g] = g % 9; }
  return pick;
}
var cur = 0, iso = false;
function build(k) {
  var B = BOARDS[k], n = B.n, t = 100 / n, el = document.getElementById('board'), L = looks(B), h = '';
  document.getElementById('title').textContent = B.title;
  var carts = {}; for (var q = 0; q < B.carts.length; q += 3) carts[B.carts[q] + ',' + B.carts[q + 1]] = B.carts[q + 2];
  var seed = 7 + k * 31; function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  var staffN = 0;
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
    var g = B.reg.charCodeAt(r * n + c) - 65, look = L[g], cls = 'tile';
    if (r === 0 || B.reg[(r - 1) * n + c] !== B.reg[r * n + c]) cls += ' edge-t';
    if (c === 0 || B.reg[r * n + c - 1] !== B.reg[r * n + c]) cls += ' edge-l';
    if (r === n - 1 || B.reg[(r + 1) * n + c] !== B.reg[r * n + c]) cls += ' edge-b';
    if (c === n - 1 || B.reg[r * n + c + 1] !== B.reg[r * n + c]) cls += ' edge-r';
    var inner = '', delay = ((r + c) * 0.06).toFixed(2);
    if (Number(B.sol[r]) === c) {
      staffN++;
      inner = '<div class="house" style="--h:' + (t * 0.55 * 4).toFixed(1) + 'px"><div class="shadow"></div>' +
        '<div class="face roof" style="background:' + ROOF[look] + ';transition-delay:' + delay + 's"></div>' +
        '<div class="face wall n" style="transition-delay:' + delay + 's"></div><div class="face wall w" style="transition-delay:' + delay + 's"></div><div class="face wall s" style="transition-delay:' + delay + 's"></div><div class="face wall e" style="transition-delay:' + delay + 's"></div></div>' +
        '<div class="stand staff" style="background-image:url(img/staff-' + (((r * 7 + k) % 9) + 1) + '.webp);transition-delay:' + (0.5 + +delay) + 's"></div>';
    } else if (carts[r + ',' + c]) {
      inner = '<div class="stand cart" style="transition-delay:' + delay + 's"></div><b class="need">' + carts[r + ',' + c] + '</b>';
    } else if (rnd() < 0.32) {
      inner = '<div class="stand tree" style="transition-delay:' + (0.3 + +delay) + 's"></div>';
    }
    h += '<div class="' + cls + '" style="left:' + (c * t) + '%;top:' + (r * t) + '%;width:' + t + '%;height:' + t + '%;background:' + COLORS[look] + '">' + inner + '</div>';
  }
  el.innerHTML = h;
  // 칸 크기에 맞춰 저택 높이를 픽셀로 다시 잡는다
  var px = el.getBoundingClientRect().width / n;
  [].forEach.call(el.querySelectorAll('.house'), function (x) { x.style.setProperty('--h', Math.round(px * 0.48) + 'px'); });
}
function setIso(on) { iso = on; document.getElementById('stage').classList.toggle('iso', on); var b = document.getElementById('toggle'); b.textContent = on ? '판으로 돌아가기' : '마을로 보기'; b.classList.toggle('on', on); }
document.getElementById('toggle').addEventListener('click', function () { setIso(!iso); });
[].forEach.call(document.querySelectorAll('[data-b]'), function (b) {
  b.addEventListener('click', function () {
    [].forEach.call(document.querySelectorAll('[data-b]'), function (x) { x.classList.toggle('on', x === b); });
    setIso(false); cur = Number(b.dataset.b); build(cur); setTimeout(function () { setIso(true); }, 900);
  });
});
window.addEventListener('resize', function () { build(cur); });
build(0); setTimeout(function () { setIso(true); }, 1200);
</script>
</body>
</html>
