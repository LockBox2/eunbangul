<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>은방울 · 판 끝 마을 연출 시안</title>
<style>

  #iso .rise { transform-origin: 50% 100%; }

  #iso .smoke { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.9); filter: blur(1.6px); opacity: 0; }

  #flat { position: absolute; transform-origin: 50% 50%; display: grid; box-shadow: 0 0 0 3px #3b2f22, 0 8px 18px rgba(0,0,0,.25); background: #3b2f22; }
  #flat i { display: block; position: relative; }
  #flat i img { position: absolute; left: 8%; top: 8%; width: 84%; }
  #flat i b { position: absolute; inset: 22%; border-radius: 50%; background: #d9603f; color: #fff; display: grid; place-items: center; font: 700 12px system-ui; }
  .hud { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .hud button { font: inherit; font-size: 15px; color: #fff6dc; background: #2e3a72; border: 1px solid #6b78b4; border-radius: 10px; padding: 10px 14px; }
  .hud button.go { background: #d9603f; border-color: #f3a184; }
  .hud button.on { outline: 2px solid #f3a184; }
  #done { position: fixed; left: 50%; top: 58px; transform: translate(-50%, -8px); background: #fdf9ef; border: 1px solid #c9b994; border-radius: 10px; padding: 8px 14px; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.15); opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; white-space: nowrap; z-index: 2; }
  #done.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<h1 id="title"></h1>
<p class="sub">판을 다 짜면 그 판이 마을이 되고, 관리원이 각 댁에 들어갑니다</p>
<div id="stage"><div id="world"><div id="iso"></div><div id="flat"></div></div></div>
<div id="done">모든 댁에 불이 켜졌습니다 · 딸랑</div>
<div class="hud">
  <button type="button" data-b="0">7×7 판</button>
  <button type="button" data-b="1" class="on">9×9 큰 댁 판</button>
  <button type="button" id="play" class="go">판 완성!</button>
</div>
<script>

var KINDS = ['sa', 'sb', 'ma', 'mb', 'farm', 'bake', 'half', 'town', 'chap'];
var cur = 1, anims = [], loops = [], timers = [], playing = false, ac = null, bellBuf = null;

function px(v) { return v.toFixed(1) + 'px'; }

function build(k) {
  stopAll();
  var B = BOARDS[k], n = B.n, L = looks(B), iso = document.getElementById('iso'), flat = document.getElementById('flat');
  document.getElementById('title').textContent = B.title;
  document.getElementById('done').classList.remove('on');
  var st = document.getElementById('stage'), sw = st.clientWidth, sh = st.clientHeight, N = n + 4;
  var s = Math.min(sw / ((n + 1.6) * TW), (sh - 20) / ((n + 1.6) * TH + 160));
  var tw = TW * s, th = TH * s, oy = -(N * th) / 2 + 40 * s;
  var carts = {}; for (var q = 0; q < B.carts.length; q += 3) carts[B.carts[q] + ',' + B.carts[q + 1]] = B.carts[q + 2];
  var seed = 11 + k * 17; function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  function at(r, c) { return { x: (c - r) * tw / 2, y: oy + (c + r + 4) * th / 2 }; }
  function img(list, z, name, x, baseY, k2, cls, extra) { var a = A[name], iw = a[0] * s * k2, ih = a[1] * s * k2; var e = add(list, z, 'img', cls || '', 'left:' + px(x - iw / 2) + ';top:' + px(baseY - ih) + ';width:' + px(iw) + (extra || '')); e.src = 'vil/' + name + '.webp'; e._h = ih; return e; }
  function tile(list, z, name, p) { var e = add(list, z, 'img', '', 'left:' + px(p.x - 227 * s / 2) + ';top:' + px(p.y) + ';width:' + px(227 * s)); e.src = 'vil/' + name + '.webp'; return e; }
  // 큰 저택(2×2) 자리
  var mAt = null, cover = {};
  if (B.big) for (var rr = 0; rr < n && !mAt; rr++) { var cc = Number(B.sol[rr]); if (B.reg[rr * n + cc] !== B.big) continue;
    [[0, 0], [-1, 0], [0, -1], [-1, -1]].forEach(function (o) { if (mAt) return; var r0 = rr + o[0], c0 = cc + o[1]; if (r0 < 0 || c0 < 0 || r0 + 1 >= n || c0 + 1 >= n) return;
      var cells = [[r0, c0], [r0 + 1, c0], [r0, c0 + 1], [r0 + 1, c0 + 1]];
      var ok = cells.every(function (p) { return B.reg[p[0] * n + p[1]] === B.big && !carts[p[0] + ',' + p[1]] && (Number(B.sol[p[0]]) !== p[1] || (p[0] === rr && p[1] === cc)); });
      if (ok) { mAt = (r0 + 1) + ',' + (c0 + 1); cells.forEach(function (p) { if (p[0] !== r0 + 1 || p[1] !== c0 + 1) cover[p[0] + ',' + p[1]] = 1; }); } });
  }
  var list = [], seq = { tint: [], fence: [], rise: [], staff: [] }, r, c, p, z;
  // 바깥: 안쪽 한 줄은 흙길(모서리 가로등), 바깥 한 줄은 숲, 앞 모서리 표지판, 왼쪽에 물레방아
  for (r = -2; r < n + 2; r++) for (c = -2; c < n + 2; c++) {
    if (r >= 0 && c >= 0 && r < n && c < n) continue;
    p = at(r, c); z = (r + c + 4) * 10;
    var road = r >= -1 && c >= -1 && r <= n && c <= n;
    tile(list, z, road ? 'dirt' : 'grass', p);
    if (!road) {
      if (r === Math.floor(n / 2) && c === -2) { var mm = HM['mill-B'], mw = tw * mm.fw, mh = mm.h * mw / mm.w, mi = add(list, z + 5, 'img', '', 'left:' + px(p.x - mw / 2) + ';top:' + px(p.y + th * 0.85 - mh) + ';width:' + px(mw)); mi.src = 'vil/h/mill-B.webp'; continue; }
      var x = rnd(), nm = r === n + 1 && c === n + 1 ? 'sign' : x < 0.45 ? 'tree-a' : x < 0.68 ? 'tree-b' : x < 0.72 ? 'flowers' : null;
      if (nm) img(list, z + 5, nm, p.x, p.y + th * 0.78, nm === 'sign' ? 0.55 : nm === 'flowers' ? 0.55 : 0.62);

    var g = B.reg.charCodeAt(r * n + c) - 65, col = L[g], depth = r + c, key = r + ',' + c;
    var isStaff = Number(B.sol[r]) === c, isHouse = mAt === key || (isStaff && !cover[key]);

      house._door = { x: p.x, y: by - th * 0.15 };

      house._smoke = [0, 1, 2].map(function () { return add(list, z + 6, 'div', 'smoke', 'left:' + px(house._chim.x - 3.5) + ';top:' + px(house._chim.y - 6)); });

    } else if (!cover[key]) {

function stopAll() { timers.forEach(clearTimeout); timers = []; anims.concat(loops).forEach(function (a) { try { a.cancel(); } catch (e) {} }); anims = []; loops = []; playing = false; }
function later(ms, fn) { timers.push(setTimeout(fn, ms)); }
function an(el, kf, opt) { var o = { fill: 'forwards', easing: 'ease-out' }; for (var key in opt) o[key] = opt[key]; var a = el.animate(kf, o); (o.iterations === Infinity ? loops : anims).push(a); return a; }

function audio() {

}
function tone(f0, f1, dur, vol, type, when) {
  var t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'triangle';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.8);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}
function click(i) { if (!ac) return; tone(190 - (i % 3) * 18, 70, 0.12, 0.35); tone(2400, 1800, 0.03, 0.08, 'square', 0.03); }
function pop(i) { if (!ac) return; tone(260 + (i % 5) * 30, 520 + (i % 5) * 40, 0.09, 0.05, 'sine'); }

}
function finish() { bell(); document.getElementById('done').classList.add('on'); playing = false; document.getElementById('play').textContent = '다시 보기'; }

function play() {
  var iso = document.getElementById('iso'), flat = document.getElementById('flat'), seq = iso._seq; if (!seq) return;
  audio(); playing = true; document.getElementById('play').textContent = '건너뛰기';
  // 1) 판이 기울어 마을 각도가 된다 (0 ~ 0.9초)
  whoosh();
  an(flat, [{ transform: 'translateY(' + (-flat._cy) + 'px) scale(' + flat._start + ') rotateX(0deg) rotateZ(0deg)' }, { transform: 'translateY(0px) scale(1) rotateX(' + TILT + 'deg) rotateZ(45deg)' }], { duration: 850, easing: 'cubic-bezier(.5,0,.3,1)' });
  an(iso, [{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: 750 });
  an(flat, [{ opacity: 1 }, { opacity: 0 }], { duration: 250, delay: 850 });
  seq.staff.forEach(function (t) { an(t.el, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 200, delay: 850 }); });
  // 2) 판 색이 걷히며 잔디가 되고, 댁 경계에 울타리가 솟는다
  var T = 1050;
  seq.tint.forEach(function (t) { an(t, [{ opacity: .85 }, { opacity: 0 }], { duration: 550, delay: T }); });
  seq.fence.forEach(function (f) { var fl = f.flip ? 'scaleX(-1) ' : ''; an(f.el, [{ opacity: 0, transform: fl + 'scaleY(0)' }, { opacity: 1, transform: fl + 'scaleY(1.12)', offset: .65 }, { opacity: 1, transform: fl + 'scaleY(1)' }], { duration: 320, delay: T + 100 + f.d * 26 }); });
  // 3) 집·수레·마당이 땅에서 쑥 솟아난다 (앞줄부터)
  var T2 = T + 300, maxD = 0;
  seq.rise.forEach(function (d, i) { maxD = Math.max(maxD, d.d); var dl = T2 + d.d * 34 + (d.deco ? 120 : 0);
    if (d.pop) { an(d.el, [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'none' }], { duration: 250, delay: dl + 250 }); return; }
    an(d.el, [{ opacity: 0, transform: 'scale(.7, .05)' }, { opacity: 1, transform: 'scale(.96, 1.14)', offset: .6 }, { opacity: 1, transform: 'scale(1.02, .97)', offset: .82 }, { opacity: 1, transform: 'none' }], { duration: 430, delay: dl, easing: 'cubic-bezier(.3,.7,.4,1)' });
    if (!d.deco) later(dl, function () { pop(i); });
  });
  // 4) 관리원이 차례로 현관에 들어가면 "딸깍", 창에 불이 켜지고 굴뚝 연기가 계속 오른다
  var order = seq.staff.slice().sort(function (a, b) { return a.d - b.d; }), t0 = T2 + maxD * 34 + 450, gap = 210, last = t0;
  order.forEach(function (t, i) {
    var at = t0 + i * gap; last = at;
    var h = t.house, dx = h ? h._door.x - t.x : 0, dy = h ? h._door.y - t.y : 0;
    an(t.el, [{ transform: 'none', opacity: 1 }, { transform: 'translate(' + dx * .5 + 'px,' + (dy * .5 - 10) + 'px) scale(.85)', opacity: 1, offset: .45 }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.3)', opacity: 0 }], { duration: 430, delay: at, easing: 'ease-in' });
    later(at + 430, function () { click(i); if (!h || h.classList.contains('lit')) return; h.classList.add('lit'); later(900, function () { h.classList.add('settle'); }); smokeLoop(h); });
  });
  later(last + 950, finish);
}
function skip() {
  timers.forEach(clearTimeout); timers = [];
  anims.forEach(function (a) { try { a.finish(); } catch (e) {} });
  document.querySelectorAll('#iso .house').forEach(function (h) { if (!h.classList.contains('lit')) { h.classList.add('lit', 'settle'); smokeLoop(h); } });
  finish();
}
document.getElementById('play').addEventListener('click', function () {
  if (playing) { skip(); return; }
  if (this.textContent === '다시 보기') { build(cur); return; }
  play();
});
document.getElementById('stage').addEventListener('click', function () { if (playing) skip(); });
document.querySelectorAll('[data-b]').forEach(function (b) {
  b.addEventListener('click', function () { document.querySelectorAll('[data-b]').forEach(function (x) { x.classList.toggle('on', x === b); }); cur = +b.dataset.b; build(cur); });
});
window.addEventListener('resize', function () { if (!playing) build(cur); });
build(cur);
</script>
</body>
</html>
