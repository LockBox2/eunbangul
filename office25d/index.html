<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>지점장실 2.5D 시험 (세 레이어)</title>
<style>
  html, body { margin: 0; height: 100%; background: #12152c; color: #fff6dc; font-family: system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  #view { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }
  .hud { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; z-index: 2; }
  .hud button { font: inherit; font-size: 14px; color: #fff6dc; background: rgba(30,38,80,.82); border: 1px solid #6b78b4; border-radius: 10px; padding: 9px 12px; min-height: 40px; }
  .hud button.on { background: #d9603f; border-color: #f3a184; }
  .info { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 2; font-size: 12px; line-height: 1.5; text-align: center; text-shadow: 0 1px 3px #000; opacity: .9; pointer-events: none; }
</style>
</head>
<body>
<div id="view"></div>
<div class="info" id="info">불러오는 중…</div>
<div class="hud">
  <button type="button" id="gyro">기울기 켜기</button>
  <button type="button" id="mode">입력: 자동 흔들기</button>
  <button type="button" id="amp">세기 1×</button>
  <button type="button" id="layers" class="on">카메라형</button>
  <button type="button" id="steam" class="on">찻잔 김</button>
  <button type="button" id="hide">단추 숨기기</button>
</div>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
// 그림 캔버스 864×1536. 세 장 모두 같은 원점·크기(잘라내지 않음)
const W = 864, H = 1536;
// 움직임 한계(원본 픽셀): 제임스 README 기준 리나 가로 ±8, 세로 ±6. 배경·앞 레이어는 고정이 기본
const LIMIT = { rina: [8, 6], bg: [9, 3], ext: [16, 5], fg: [0, 0], rinaCam: 2 };
// 카메라형(기본): 초점을 리나에 맞춘 카메라처럼 리나·책상은 그대로, 배경만 반대로 움직인다. 리나형: 리나만 움직인다(비교용)
let amp = 1, cam2 = true, mode = 'auto';
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, premultipliedAlpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(0, W, 0, -H, -100, 100); // 위가 0, 아래로 -H
const loader = new THREE.TextureLoader();
// rect: 캔버스 좌표의 [x, y, w, h]. 없으면 캔버스 전체. 키우고 옮기는 건 캔버스 가운데 기준(그룹)
function plane(url, z, rect) {
  const tex = loader.load(url, () => { loaded++; if (loaded === 4) { document.getElementById('info').textContent = info0; draw(); } });
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const [x, y, w, h] = rect || [0, 0, W, H];
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  m.position.set(x + w / 2 - W / 2, -(y + h / 2) + H / 2, 0);
  const g = new THREE.Group(); g.add(m); g.position.set(W / 2, -H / 2, z); scene.add(g); return g;
}
let loaded = 0;
const info0 = 'v5 · 새 정원 + 움직이는 찻잔 김 · 단추 숨긴 뒤 화면을 두 번 누르면 다시 나와요';
// 배경은 움직일 때 가장자리가 드러나지 않게 살짝 키워 둔다 (배경도 움직이기 켰을 때만)
// 네 층: 창밖(가장 멀다) / 방(유리 칸만 뚫림) / 리나 / 책상·안나
// 정원: 제임스 v5 여유분 그림(432×640, 캔버스 x -40, y 470). 움직여도 왼쪽이 비지 않는다
const ext = plane('garden.webp', -30, [-40, 470, 432, 640]), bg = plane('room.webp', -20), rina = plane('rina.webp', -8), fg = plane('fg.webp', 0);
// 찻잔 김: 원화에서 지운 김을 셰이더로 그린다. 찻잔 입구(가운데 x 696, y 1205) 위로 두 가닥이 피어올라 흔들리며 사라진다
// 리나 앞, 책상(찻잔) 뒤에 둬서 김 밑동은 찻잔 테두리에 가려진다
// 그림 상자를 김보다 넉넉히 잡고(가닥이 흔들려도 상자 끝에 잘리지 않게) 모양은 190×190 기준으로 그린다
const SW = 340, SH = 300, CUP = [696, 1212];
const steamMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { t: { value: 0 }, a: { value: 1 } },
  vertexShader: 'varying vec2 v; void main(){ v = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    varying vec2 v; uniform float t; uniform float a;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
    float wisp(float x, float y, float ph, float sp){
      float sway = sin(y*6.0 - t*sp + ph) * 0.16 * (0.25 + y) + sin(y*13.0 - t*sp*1.7 + ph*2.0) * 0.04 * y + (n(vec2(y*3.0 - t*0.4, ph)) - 0.5) * 0.30 * y;
      float wdt = 0.03 + 0.07 * y;
      float d = (x - 0.5 - sway) / wdt;
      return exp(-d*d);
    }
    void main(){
      float x = 0.5 + (v.x - 0.5) * 340.0 / 190.0, y = v.y * 300.0 / 190.0;
      float edge = smoothstep(0.0, 0.15, v.x) * (1.0 - smoothstep(0.85, 1.0, v.x)) * (1.0 - smoothstep(0.8, 1.0, v.y));
      float s = wisp(x + 0.05, y, 0.0, 1.3) * 0.9 + wisp(x - 0.06, y, 2.4, 1.05) * 0.7;
      float br = 0.55 + 0.45 * n(vec2(x*6.0, y*5.0 - t*0.9));
      float fade = smoothstep(0.0, 0.10, y) * (1.0 - smoothstep(0.35, 0.95, y));
      float alpha = clamp(s * br * fade * edge * 0.62 * a, 0.0, 1.0);
      gl_FragColor = vec4(vec3(1.0, 0.98, 0.95), alpha);
    }`
});
const steam = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), steamMat);
steam.position.set(CUP[0], -(CUP[1] - SH / 2), -4); scene.add(steam);
let steamOn = true;
document.getElementById('steam').addEventListener('click', (e) => { steamOn = !steamOn; steam.visible = steamOn; e.target.classList.toggle('on', steamOn); kick(); });
// 화면 채우기: 게임 처음 화면처럼 cover, 아래쪽 80% 기준
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight; renderer.setSize(vw, vh);
  const k = Math.max(vw / W, vh / H), w = vw / k, h = vh / k, x0 = (W - w) * 0.5, y0 = (H - h) * 0.92;
  cam.left = x0; cam.right = x0 + w; cam.top = -y0; cam.bottom = -(y0 + h); cam.updateProjectionMatrix(); draw();
}
window.addEventListener('resize', fit);
// 입력 → 목표 기울기(-1..1), 부드럽게 따라간다
let tx = 0, ty = 0, cx = 0, cy = 0, base = null, last = 0, running = false;
function setTarget(x, y) { tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); kick(); }
function onOrient(e) {
  if (mode !== 'gyro' || e.gamma == null) return;
  if (!base) base = { g: e.gamma, b: e.beta };
  // 4도 기울이면 끝까지. 처음 켠 각도를 기준으로 잡는다
  setTarget((e.gamma - base.g) / 4, (e.beta - base.b) / 4);
}
document.getElementById('gyro').addEventListener('click', async () => {
  try {
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') throw new Error('denied');
    }
    window.addEventListener('deviceorientation', onOrient); mode = 'gyro'; base = null;
    document.getElementById('mode').textContent = '입력: 기울기'; document.getElementById('gyro').classList.add('on');
    document.getElementById('info').textContent = '폰을 살짝 기울여 보세요 (지금 각도가 기준)';
  } catch (e) { document.getElementById('info').textContent = '이 브라우저에서는 기울기를 쓸 수 없어요. 화면을 끌어 보세요'; mode = 'touch'; document.getElementById('mode').textContent = '입력: 끌기'; }
});
document.getElementById('mode').addEventListener('click', () => {
  mode = mode === 'auto' ? 'touch' : mode === 'touch' ? (base !== undefined && document.getElementById('gyro').classList.contains('on') ? 'gyro' : 'auto') : 'auto';
  base = null; document.getElementById('mode').textContent = '입력: ' + ({ auto: '자동 흔들기', touch: '끌기', gyro: '기울기' })[mode]; setTarget(0, 0);
});
document.getElementById('amp').addEventListener('click', () => { amp = amp === 1 ? 1.5 : amp === 1.5 ? 0.5 : 1; document.getElementById('amp').textContent = '세기 ' + amp + '×'; bgScale(); kick(); });
document.getElementById('layers').addEventListener('click', (e) => { cam2 = !cam2; e.target.textContent = cam2 ? '카메라형' : '리나형: 리나만 움직임'; e.target.classList.toggle('on', cam2); bgScale(); kick(); });
// 배경이 움직여도 가장자리가 드러나지 않게 1.5% 키워 둔다
function bgScale() { const a = Math.max(1, amp), k = cam2 ? 1 + 0.025 * a : 1, ke = cam2 ? 1 + 0.045 * a : 1; bg.scale.set(k, k, 1); ext.scale.set(ke, ke, 1); }
bgScale();
document.getElementById('hide').addEventListener('click', () => { document.querySelector('.hud').style.display = 'none'; document.getElementById('info').style.display = 'none'; });
document.getElementById('view').addEventListener('dblclick', () => { document.querySelector('.hud').style.display = ''; document.getElementById('info').style.display = ''; });
// 끌기: 화면 가운데에서 얼마나 떨어졌는지로
const view = document.getElementById('view');
view.addEventListener('pointermove', (e) => { if (mode !== 'touch' || !(e.buttons || e.pointerType === 'touch')) return; setTarget((e.clientX / innerWidth - 0.5) * 2, (e.clientY / innerHeight - 0.5) * 2); });
view.addEventListener('pointerup', () => { if (mode === 'touch') setTarget(0, 0); });
// 움직일 때만 그린다 (배터리)
function kick() { if (!running) { running = true; requestAnimationFrame(tick); } }
function tick(t) {
  if (mode === 'auto') { const s = t / 1000; tx = Math.sin(s * 0.7) * 0.9; ty = Math.sin(s * 0.53 + 1) * 0.7; }
  cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08;
  const rm = cam2 ? 0 : 1, bm = cam2 ? 1 : 0;
  // 카메라형에서도 리나는 가로로만 2px 카메라 쪽으로 살짝: 배경과 반대로 움직여 층이 갈려 보인다 (세로로 움직이면 치마 아래 잘린 선이 드러난다)
  rina.position.x = W / 2 + cx * (cam2 ? LIMIT.rinaCam : LIMIT.rina[0]) * amp; rina.position.y = -H / 2 - cy * LIMIT.rina[1] * amp * rm;
  bg.position.x = W / 2 - cx * LIMIT.bg[0] * amp * bm; bg.position.y = -H / 2 + cy * LIMIT.bg[1] * amp * bm;
  ext.position.x = W / 2 - cx * LIMIT.ext[0] * amp * bm; ext.position.y = -H / 2 + cy * LIMIT.ext[1] * amp * bm;
  steamMat.uniforms.t.value = t / 1000;
  draw();
  if (mode === 'auto' || steamOn || Math.abs(tx - cx) > 0.002 || Math.abs(ty - cy) > 0.002) requestAnimationFrame(tick); else running = false;
}
// 김이 켜져 있으면 계속 그리되 초당 30장 정도로
let lastDraw = 0;
function draw() { const now = performance.now(); if (now - lastDraw < 30 && running) return; lastDraw = now; renderer.render(scene, cam); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && mode === 'auto') kick(); });
fit(); kick();
</script>
</body>
</html>
